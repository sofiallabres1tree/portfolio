    <h1 class="c-h1" style="margin: 0; display: flex; align-items: flex-end; font-size: max(52px, min(14vw, 17vh, 220px)); font-weight: 500; line-height: 0.82; letter-spacing: -0.055em; color: #E25600;">
      <span style="display: inline-block; transform: translateY(-0.05em);">h</span>

      <span style="display: inline-block; transform: translateY(-0.04em);">l</span>
      <span style="display: inline-block; transform: translateY(0.06em);">l</span>
      <span style="display: inline-block; transform: translateY(-0.055em);">o</span>

      <div class="c-left" style="display: flex; flex-direction: column; gap: clamp(14px, 2.6vh, 28px);">
        
        <div style="border-top: 1px solid #14130f;">
          <a href="mailto:sofiallabres1@g.ucla.edu" style="display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: clamp(8px, 1.6vh, 18px) 0; border-bottom: 1px solid #dfd6a8;" class="c-row" style-hover="color: #d9607f;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #8a8262;">Email</span>
            <span class="c-val" style="font-size: max(15px, min(1.7vw, 2.6vh, 24px)); font-weight: 500; letter-spacing: -0.02em; overflow-wrap: anywhere;">sofiallabres1@g.ucla.edu</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px;">↗</span>
          </a>
          <a href="https://www.linkedin.com/in/sofia-llabres-a31a4339a" target="_blank" rel="noopener" style="display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: clamp(8px, 1.6vh, 18px) 0; border-bottom: 1px solid #dfd6a8;" class="c-row" style-hover="color: #6f87d4;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #8a8262;">LinkedIn</span>
            <span class="c-val" style="font-size: max(15px, min(1.7vw, 2.6vh, 24px)); font-weight: 500; letter-spacing: -0.02em;">/in/sofia-llabres</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px;">↗</span>
          </a>
          <div style="display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: clamp(8px, 1.6vh, 18px) 0; border-bottom: 1px solid #dfd6a8;" class="c-row">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #8a8262;">Based</span>
            <span class="c-val" style="font-size: max(15px, min(1.7vw, 2.6vh, 24px)); font-weight: 500; letter-spacing: -0.02em;">LA &amp; Bay Area</span>
            <span></span>
          </div>
        </div>
        <div ref="{{ dogRef }}" aria-hidden="true" class="c-dog" style="position: relative; width: min(88%, 58vh, 480px); aspect-ratio: 680 / 455; margin-left: 4%; pointer-events: none;">
          <img src="works/contact/run-1.png" alt="" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 1;">
          <img src="works/contact/run-2.png" alt="" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;">
          <img src="works/contact/run-3.png" alt="" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;">
          <img src="works/contact/run-4.png" alt="" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;">
          <img src="works/contact/run-5.png" alt="" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;">
          <img src="works/contact/run-6.png" alt="" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;">
          <img src="works/contact/run-7.png" alt="" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;">

      <form class="c-form" onSubmit="{{ submit }}" style="display: flex; flex-direction: column; gap: clamp(10px, 1.8vh, 20px); background: #fbf7df; border: 1px solid #14130f; border-radius: 18px; padding: clamp(16px, 2.6vh, 32px) clamp(18px, 2.4vw, 34px);">
        <label class="c-field" style="display: flex; flex-direction: column; gap: 8px;">

        <label class="c-field" style="display: flex; flex-direction: column; gap: 8px;">

          <input type="email" value="{{ email }}" onChange="{{ onEmail }}" required="" placeholder="you@studio.com" style="border: none; border-bottom: 1px solid #14130f; background: transparent; padding: 6px 0; font-size: 16px; outline: none;">

        <div class="c-field" style="display: flex; flex-direction: column; gap: 10px;">

          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{ topics }}" as="t" hint-placeholder-count="4">
              <button type="button" class="c-chip" onClick="{{ t.pick }}" style="border: 1px solid {{ t.bd }}; border-radius: 999px; padding: 8px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; background: {{ t.bg }}; color: {{ t.fg }};">{{ t.label }}</button>
            </sc-for>

        <label class="c-field" style="display: flex; flex-direction: column; gap: 8px;">

    <a href="https://www.linkedin.com/in/sofia-llabres-a31a4339a" style="color: #8a8262;" style-hover="color: #e8402a;">LinkedIn ↗</a>

</x-dc>
<script type="text/x-dc" data-dc-script>
const TOPICS = ["Commission", "Collaboration", "Internship", "Just saying hi"];

class Component extends DCLogic {
  state = { name: "", email: "", message: "", topic: "Commission", sent: false };
  dogRef = React.createRef();
  componentDidMount() {
    let last = -1;
    const tick = (t) => {
      const el = this.dogRef.current;
      const f = Math.floor(t / 85) % 8;
      if (el && f !== last) {
        const imgs = el.querySelectorAll("img");
        imgs.forEach((im, i) => { im.style.opacity = i === f ? "1" : "0"; });
        last = f;
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const s = this.state;
    return {
      dogRef: this.dogRef,
      name: s.name, email: s.email, message: s.message, sent: s.sent,
      onName: (e) => this.setState({ name: e.target.value }),
      onEmail: (e) => this.setState({ email: e.target.value }),
      onMessage: (e) => this.setState({ message: e.target.value }),
      topics: TOPICS.map((t) => ({
        label: t,
        bg: s.topic === t ? "#0077ff" : "transparent",
        bd: s.topic === t ? "#0077ff" : "#14130f",
        fg: s.topic === t ? "#f7f1c9" : "#14130f",
        pick: () => this.setState({ topic: t }),
      })),
      submit: (e) => {
        e.preventDefault();
        const subject = encodeURIComponent(`${s.topic} — from ${s.name}`);
        const body = encodeURIComponent(`${s.message}\n\n— ${s.name} (${s.email})`);
        window.location.href = `mailto:sofiallabres1@g.ucla.edu?subject=${subject}&body=${body}`;
        this.setState({ sent: true });
      },
    };
  }
}
</script>
