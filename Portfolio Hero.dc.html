<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f7f1c9; }
  * { box-sizing: border-box; }
  a { color: #14130f; text-decoration: none; }
  a:hover { color: #e8402a; }
  /* mouse/trackpad screens: eyes peek out behind the "Ll" of Llabres (--eye-x/--eye-y are set from the page script) */
  @media (hover: hover) and (min-width: 600px) {
    /* no stacking context on the wrapper, so the canvas can sit under the name while the hint sits over it */
    .eye-wrap { z-index: auto !important; }
    .eye-wrap .eye-box { position: absolute; left: calc(var(--eye-x, 75vw) - var(--w) * 0.666); top: calc(var(--eye-y, 60vh) - var(--w) * 1608 / 1303 * 0.384); }
    .eye-wrap #eye-grow { position: relative; z-index: 0; }
    .eye-wrap [data-eye-hint] { z-index: 2; }
  }
  /* small-viewport units keep the name above the phone's browser bar; --name-lift adds room below it */
  .hero-stage { height: 100vh; height: 100svh; margin-bottom: -100vh; margin-bottom: -100svh; }
  .eye-wrap { height: 100vh !important; height: 100svh !important; }
  :root { --name-lift: 0px; }
  @media (hover: none) { :root { --name-lift: 18px; } }
  /* eye piece: as tall as the space between header and name allows, never wider than the screen */
  .eye-box { position: relative; --vh: 100vh; --gap: calc(clamp(64px, 9vh, 96px) + min(13.5vw, 25vh) * 1.72 + 72px + var(--name-lift)); --w: min(100%, calc((var(--vh) - var(--gap)) * 1303 / 1608)); width: var(--w); flex: none; }
  @supports (height: 100svh) { .eye-box { --vh: 100svh; } }
  @media (hover: hover) and (min-width: 600px) { .eye-box { --gap: clamp(64px, 9vh, 96px); --w: calc((var(--vh) - var(--gap)) * 1303 / 1608); } }
  .hint-touch { display: none; }
  @media (hover: none) { .hint-touch { display: inline; } .hint-hover { display: none; } }
</style>
<script src="./cursor.js"></script>
<script src="./eye-grow/eye-grow.js"></script>
</helmet>
<div ref="{{ rootRef }}" style="position: relative; background: #f7f1c9; color: #14130f; font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;">

  <div aria-hidden="true" class="hero-stage" style="position: sticky; top: 0; z-index: 1; overflow: hidden; pointer-events: none;">
    <sc-if value="{{ showGrain }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; inset: 0; opacity: 0.22; mix-blend-mode: multiply; background-image: url(&quot;data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'&gt;&lt;filter id='n'&gt;&lt;feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/&gt;&lt;/filter&gt;&lt;rect width='160' height='160' filter='url(%23n)' opacity='0.5'/&gt;&lt;/svg&gt;&quot;);"></div>
    </sc-if>

      <div style="display: flex; align-items: flex-end; font-size: min(13.5vw, 25vh); font-weight: 500; line-height: 0.74; letter-spacing: -0.05em; color: #E25600; transform: scaleY(2.25); transform-origin: bottom;"><span data-ll="" style="display: inline-block; transform: translateY(0.03em);">L</span><span data-ll="" style="display: inline-block; transform: translateY(-0.03em);">l</span><span style="display: inline-block; transform: translateY(0.035em);">a</span><span style="display: inline-block; transform: translateY(-0.02em);">b</span><span style="display: inline-block; transform: translateY(0.035em);">r</span><span style="display: inline-block; transform: translateY(-0.03em);">e</span><span style="display: inline-block; transform: translateY(0.025em);">s</span></div>

<script type="text/x-dc" data-dc-script data-props="{&quot;showGrain&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Surface&quot;}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.root = React.createRef(); }
  componentDidMount() {
    const el = this.root.current; if (!el) return;
    this.placeEyes = () => {
      const ls = el.querySelectorAll("[data-ll]"); if (ls.length < 2) return;
      const l = ls[1].getBoundingClientRect();
      // the gap between the eyes sits on the "l"; the eyes peek out just behind the tops of the Ls
      el.style.setProperty("--eye-x", ((l.left + l.right) / 2) + "px");
      el.style.setProperty("--eye-y", l.top + "px");
    };
    this.placeEyes();
    document.fonts && document.fonts.ready.then(this.placeEyes);
    window.addEventListener("resize", this.placeEyes);
    if (!("IntersectionObserver" in window)) return;
    const nodes = [...el.querySelectorAll("[data-reveal]")];
    this.io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { e.target.style.opacity = "1"; e.target.style.transform = "none"; this.io.unobserve(e.target); }
    }), { rootMargin: "0px 0px -8% 0px" });
    nodes.forEach((n, i) => {
      if (n.getBoundingClientRect().top > window.innerHeight) {
        n.style.opacity = "0";
        n.style.transform = "translateY(70px) rotate(" + (i % 2 ? 1.5 : -1.5) + "deg)";
      }
      this.io.observe(n);
    });
  }
  componentWillUnmount() { this.io && this.io.disconnect(); window.removeEventListener("resize", this.placeEyes); }
  renderVals() {
    return { rootRef: this.root, showGrain: this.props.showGrain ?? true };
  }
}
</script>
